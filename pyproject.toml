[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectraseek"
version = "0.1.0"
description = "AI-based target discovery and search optimization in authorized wireless networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "fastapi>=0.110", "uvicorn>=0.27", "streamlit>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
spectraseek = "spectraseek.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
