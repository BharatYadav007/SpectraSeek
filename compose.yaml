services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: spectraseek
      POSTGRES_USER: spectraseek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - survey_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectraseek -d spectraseek"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  survey_data:
