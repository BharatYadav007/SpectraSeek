name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spectraseek
          POSTGRES_PASSWORD: spectraseek_test
          POSTGRES_DB: spectraseek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectraseek -d spectraseek_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPECTRASEEK_TEST_DATABASE_URL: postgresql+psycopg://spectraseek:spectraseek_test@127.0.0.1:5432/spectraseek_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q
